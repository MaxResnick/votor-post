<style>
:root{
  --text-color:#333; --link-color:rgb(0,100,200); --link-hover-color:rgb(0,70,160);
  --muted-color:#555; --date-color:#777; --code-bg:rgba(27,31,35,.05); --divider-color:rgba(0,0,0,.15);
  --border-color:#ccc; --page-max-width:800px; --page-padding:2rem; --page-padding-mobile:1rem;
  --font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;
  --font-family-mono:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
}
html{scroll-behavior:smooth}
body{background:#fff; color:var(--text-color); margin:0; padding:8px; box-sizing:border-box; font-family:var(--font-family)}
p{font-size:1.2rem; line-height:1.6em}
.changes{font-size:1.05rem; line-height:1.5; padding-left:1.2em; margin:.2em 0 2em}
.changes li{margin:.4em 0}
.changes .ln{font-family:var(--font-family-mono); font-size:.88em; color:#666; margin-right:.35em; white-space:nowrap}
a{color:var(--link-color); text-decoration:none} a:hover{text-decoration:underline}
code{font-family:var(--font-family-mono); padding:.2em .4em; margin:0; font-size:85%; background:var(--code-bg); border-radius:3px}
.top-nav{max-width:var(--page-max-width); margin:0 auto; padding:1rem var(--page-padding); display:flex; justify-content:space-between; align-items:center}
.top-nav .nav-link{display:flex; align-items:center; gap:.5rem; color:var(--muted-color); font-size:.95rem}
.top-nav .nav-link:hover{color:var(--link-color); text-decoration:none}
.page-container{max-width:var(--page-max-width); margin:0 auto; padding:var(--page-padding)}
.page-container ul,.page-container ol{font-size:1.2rem; line-height:1.6em; margin:1rem 0}
.page-container li{margin-bottom:.5rem}
@media(min-width:1200px){.top-nav,.page-container{margin-left:max(280px,calc((100vw - 900px)/2))}}
.article-title{font-size:2.7em; margin:.67em 0 0; line-height:1.15}
.article-subtitle{font-size:1.4em; font-weight:400; color:var(--muted-color); margin:.3em 0 0; font-style:italic}
.byline-dateline-container{display:flex; justify-content:space-between; align-items:baseline; margin:1em 0 2em}
.byline,.dateline{margin:0; font-size:1.1rem} .dateline{color:var(--date-color)}
.section-heading{font-size:1.75rem; font-weight:600; margin:2.5rem 0 1rem}
h2{font-size:1.5rem; font-weight:700; margin:1.6em 0 .8em}
.section-divider{border:none; border-top:1px solid var(--divider-color); margin:2rem 0}

/* table of contents */
.toc-sidebar{position:fixed; left:30px; top:110px; width:260px; max-height:calc(100vh - 150px); overflow-y:auto; display:none}
@media(min-width:1200px){.toc-sidebar{display:block}}
.toc-title{font-size:.9rem; font-weight:600; color:var(--muted-color); letter-spacing:.05em; text-transform:uppercase; margin:0 0 12px}
.toc-list{list-style:none; padding:0; margin:0}
.toc-list li{margin:0}
.toc-item{display:block; width:100%; text-align:left; background:none; border:none; border-left:3px solid transparent; padding:6px 12px; font:inherit; font-size:.95rem; line-height:1.35; color:var(--text-color); cursor:pointer}
.toc-item.h2{padding-left:26px; font-size:.9rem; color:var(--muted-color)}
.toc-item:hover{color:var(--link-color)}
.toc-item.active{color:var(--link-color); border-left-color:var(--link-color); background:#f0f7ff; font-weight:500}

/* figures & algorithm boxes */
.figure{margin:8px 0 32px}
.figure-content{padding:8px 0; display:flex; justify-content:center}
.figure-content img.plot{display:block; max-width:100%; height:auto}
.figure-caption{font-size:1.1rem; line-height:1.5; color:#666; text-align:left}
.figure-number{font-weight:600}
.figure.wide{--w:min(1180px, calc(100vw - 340px)); width:var(--w); margin-left:calc((100% - var(--w)) / 2)}
@media(max-width:1199px){.figure.wide{--w:min(1180px, calc(100vw - 2 * var(--page-padding) - 16px))}}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:28px; width:100%}
@media(max-width:820px){.pair{grid-template-columns:1fr}}
.algorithm-box{margin:8px 0}
.algorithm-title{font-size:19px; font-weight:600; padding-bottom:10px; margin-bottom:14px; border-bottom:1px solid var(--border-color)}
.algorithm-line{display:flex; gap:12px; font-size:15.5px; line-height:1.6; margin-bottom:3px}
.algorithm-line .line-number{min-width:24px; flex:none; text-align:right; color:#888}
.algorithm-line .line-body{padding-left:calc(var(--i, 0) * 1.6em)}
.algorithm-gap{height:10px}
.kw{font-weight:600}
.cm{color:#888}
mark{background:#fff3a1; color:inherit; padding:0 2px; border-radius:2px}
mark.del{background:#ffd9d6} mark.add{background:#d5f1db}
.legend{font-size:1.05rem; color:#666; margin:-.5em 0 1em}

/* protocol simulator */
.sim{width:100%}
.sim canvas{display:block; width:100%; background:#fff}

/* top-100 heatmap */
.hm-wrap{position:relative; width:100%}
.hm-wrap canvas{display:block; width:100%}
.hm-tip{position:absolute; pointer-events:none; background:#fff; border:1px solid #ccc; border-radius:3px; padding:6px 9px; font-size:11.5px; line-height:1.5; color:#333; box-shadow:0 2px 8px rgba(0,0,0,.12); display:none; max-width:360px; z-index:5}

/* leader x validator matrix */
.mx-wrap{width:100%; overflow-x:auto}
table.mx{border-collapse:collapse; margin:0 auto; font-size:11px; font-family:var(--font-family-mono)}
table.mx th{font-family:var(--font-family); font-weight:600; color:#555; padding:3px 7px; border:1px solid #e7e7e7; background:#fafafa; font-size:11px}
table.mx td{padding:3px 7px; border:1px solid #e7e7e7; text-align:center; white-space:nowrap}
table.mx td .sl{color:#6a4fc9; font-weight:600}
table.mx td .fa{color:#c2410c}
table.mx td .al{color:#666}
table.mx td .dp{color:#2e8b57; font-weight:600}
table.mx th.rowh{text-align:right; font-weight:600}
table.mx td.agg{border-left:2px solid #ccc; font-weight:600}

/* tables */
table.t{border-collapse:collapse; font-size:1.05rem; margin:.6em 0 1.4em; width:100%}
table.t th,table.t td{border:1px solid #e0e0e0; padding:6px 12px; text-align:left; vertical-align:top}
table.t th{background:#f9f9f9; font-weight:600}
table.t td.mono{font-family:var(--font-family-mono); font-size:.95rem; white-space:nowrap}
table.t .del{color:#b3261e; font-weight:600}

/* references */
.ref{color:var(--link-color); cursor:help; font-size:.9em; vertical-align:baseline}
.ref:hover{text-decoration:underline}
.article-footer{color:#777; font-size:1.1rem; margin-top:3rem}
.article-footer h2{font-size:1.5rem; color:#777}
.article-footer ol{padding-left:1.5rem; font-size:1.1rem; line-height:1.5}
.article-footer li{margin-bottom:.75rem}
</style>

<script>
(function(){
  // --- render algorithm boxes from the plain-text sources above ---
  var CALL = /\b([A-Za-z_]\w*\((?:[^()]|\([^()]*\))*\))/g;
  var VOTE = /\b(SkipFallback|NotarizeFallback|Notarize|Skip|Finalize|Propose|FinalSetShred|ParentReady|Block)\b(?![\w(])/g;
  var PCT  = /(\d+%)/g;
  var KW   = /^(\s*)(upon receiving|upon|at|else if|else|if|broadcast|set|enter slot|do nothing|hold|state per slot)\b/;
  function decorateText(t){
    var ci = t.indexOf('//');
    var code = ci >= 0 ? t.slice(0, ci) : t, cm = ci >= 0 ? t.slice(ci) : '';
    code = code.replace(/\bat (T_s = [^:]+|T = [^:]+):/, function(_, e){ return 'at <code>' + e + '</code>:'; });
    code = code.replace(/T_s &lt; \dΔ/g, function(m){ return '<code>' + m + '</code>'; });
    code = code.split(/(<code>[^<]*<\/code>)/g).map(function(seg){
      if (seg.indexOf('<code>') === 0) return seg;
      return seg.replace(CALL, '<code>$1</code>').replace(PCT, '<code>$1</code>').replace(VOTE, '<code>$1</code>');
    }).join('');
    code = code.replace(KW, '$1<span class="kw">$2</span>');
    return code + (cm ? '<span class="cm">' + cm + '</span>' : '');
  }
  function decorate(html){
    return html.split(/(<[^>]+>)/g).map(function(seg){ return seg.charAt(0) === '<' ? seg : decorateText(seg); }).join('');
  }
  var sources = {};
  document.querySelectorAll('script[type="text/plain"][data-src]').forEach(function(s){ sources[s.getAttribute('data-src')] = s.textContent; });
  document.querySelectorAll('.algorithm-content[data-alg]').forEach(function(box){
    var src = sources[box.getAttribute('data-alg')] || '';
    var html = '';
    src.replace(/^\n+|\n+$/g, '').split('\n').forEach(function(line){
      if (!line.trim()) { html += '<div class="algorithm-gap"></div>'; return; }
      var m = line.match(/^\s*(\d+)\s{2}( *)(.*)$/);
      if (!m) { html += '<div class="algorithm-line"><span class="line-number"></span><span class="line-body">' + decorate(line) + '</span></div>'; return; }
      var indent = Math.floor(m[2].length / 4);
      html += '<div class="algorithm-line"><span class="line-number">' + m[1] + ':</span><span class="line-body" style="--i:' + indent + '">' + decorate(m[3]) + '</span></div>';
    });
    box.innerHTML = html;
  });

  // --- table of contents ---
  var toc = document.getElementById('toc');
  var heads = Array.prototype.slice.call(document.querySelectorAll('h1.section-heading[id], .page-container h2[id]'));
  heads.forEach(function(h){
    var li = document.createElement('li');
    var b = document.createElement('button');
    b.className = 'toc-item' + (h.tagName === 'H2' ? ' h2' : '');
    b.textContent = h.textContent;
    b.addEventListener('click', function(){ h.scrollIntoView({behavior:'smooth', block:'start'}); });
    li.appendChild(b); toc.appendChild(li);
    h._tocItem = b;
  });
  function setActive(){
    var y = window.scrollY + 140, cur = heads[0];
    heads.forEach(function(h){ if (h.offsetTop <= y) cur = h; });
    heads.forEach(function(h){ h._tocItem.classList.toggle('active', h === cur); });
  }
  window.addEventListener('scroll', setActive, {passive:true}); setActive();
})();
</script>
